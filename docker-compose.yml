services:
  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./apps/backend
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/HiltDB
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: ${S3_BUCKET:-hilt-media}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-hilt-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-hilt-local-development}
    depends_on:
      mongodb:
        condition: service_healthy
      storage:
        condition: service_started

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.53
    command: ['mini', '-dir=/data']
    ports:
      - '127.0.0.1:8333:8333'
    environment:
      S3_BUCKET: ${S3_BUCKET:-hilt-media}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-hilt-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-hilt-local-development}
    volumes:
      - storage_data:/data

volumes:
  mongodb_data:
  frontend_node_modules:
  storage_data:
