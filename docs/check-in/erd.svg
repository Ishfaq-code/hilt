automatic»</text><text x="502.36" y="236.205" fill="#000" font-size="15" textLength="227.937">updatedAt : Date «automatic»</text><text x="502.36" y="253.666" fill="#000" font-size="15" textLength="289.658">__v : Number «Mongoose version key»</text></g><!--class Session--><g class="entity" data-qualified-name="Session" id="ent0002" data-source-line="27"><rect x="7" y="347.394" width="466.878" height="148.227" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="211.823" y="366.317" fill="#000" font-size="15" textLength="57.231">Session</text><text x="208.769" y="383.778" fill="#000" font-size="15" textLength="63.34">sessions</text><line x1="8" y1="392.316" x2="472.878" y2="392.316" style="stroke:#181818;stroke-width:0.5;"/><text x="13" y="410.239" fill="#000" font-size="15" textLength="219.463">*_id : ObjectId «primary key»</text><line x1="8" y1="417.777" x2="472.878" y2="417.777" style="stroke:#181818;stroke-width:1;"/><text x="13" y="435.7" fill="#000" font-size="15" textLength="257.021">*user : ObjectId «reference: User»</text><text x="13" y="453.161" fill="#000" font-size="15" textLength="454.878">*tokenHash : String «unique, SHA-256, excluded by default»</text><text x="13" y="470.622" fill="#000" font-size="15" textLength="400.891">*expiresAt : Date «TTL index, expireAfterSeconds: 0»</text><text x="13" y="488.083" fill="#000" font-size="15" textLength="289.658">__v : Number «Mongoose version key»</text></g><!--class Organization--><g class="entity" data-qualified-name="Organization" id="ent0003" data-source-line="36"><rect x="508.89" y="321.204" width="405.098" height="200.609" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="663.359" y="340.127" fill="#000" font-size="15" textLength="96.16">Organization</text><text x="575.238" y="357.588" fill="#000" font-size="15" textLength="272.402">organizations · model and seed only</text><line x1="509.89" y1="366.126" x2="912.988" y2="366.126" style="stroke:#181818;stroke-width:0.5;"/><text x="514.89" y="384.049" fill="#000" font-size="15" textLength="219.463">*_id : ObjectId «primary key»</text><line x1="509.89" y1="391.587" x2="912.988" y2="391.587" style="stroke:#181818;stroke-width:1;"/><text x="514.89" y="409.51" fill="#000" font-size="15" textLength="196.707">*name : String «trimmed»</text><text x="514.89" y="426.971" fill="#000" font-size="15" textLength="270.652">*owner : ObjectId «reference: User»</text><text x="514.89" y="444.432" fill="#000" font-size="15" textLength="386.294">members : ObjectId[] «references: User, default []»</text><text x="514.89" y="461.893" fill="#000" font-size="15" textLength="393.098">description : String «trimmed, default empty string»</text><text x="514.89" y="479.354" fill="#000" font-size="15" textLength="223.03">createdAt : Date «automatic»</text><text x="514.89" y="496.815" fill="#000" font-size="15" textLength="227.937">updatedAt : Date «automatic»</text><text x="514.89" y="514.276" fill="#000" font-size="15" textLength="289.658">__v : Number «Mongoose version key»</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="53"><path d="M40.56,581.814 L40.56,644.197 A0,0 0 0 0 40.56,644.197 L440.31,644.197 A0,0 0 0 0 440.31,644.197 L440.31,591.814 L430.31,581.814 L244.44,581.814 L240.44,496.094 L236.44,581.814 L40.56,581.814 A0,0 0 0 0 40.56,581.814" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M430.31,581.814 L430.31,591.814 L440.31,591.814 L430.31,581.814" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="46.56" y="600.737" fill="#000" font-size="15" textLength="303.252">Raw session tokens are never persisted.</text><text x="46.56" y="618.198" fill="#000" font-size="15" textLength="378.75">Expiry is checked on every authenticated request;</text><text x="46.56" y="635.659" fill="#000" font-size="15" textLength="300.044">MongoDB TTL deletion is asynchronous.</text></g><g class="entity" data-qualified-name="GMN10" 